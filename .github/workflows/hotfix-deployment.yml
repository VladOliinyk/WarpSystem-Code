name: Discord CI

on:
  push:
    branches:
      - master
      - hotfix

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK 1.8
      uses: actions/setup-java@v1
      with:
        java-version: 1.8
    - name: Build dependencies
      run: |
        mvn install:install-file -Dfile=./lib/GemsEconomy-4.8.3.jar -DgroupId=me.xanium -DartifactId=GemsEconomy -Dversion=4.8.3 -Dpackaging=jar
        mvn install:install-file -Dfile=./lib/PlayerPoints.jar -DgroupId=org.black_ixx -DartifactId=PlayerPoints -Dversion=2.1.4 -Dpackaging=jar
    - name: Build with Maven
      run: |
        cd ./WarpSystem
        mvn clean package
        cd ../
    - name: Deploy
      run: |
        rank="<@&793495281387700234>"
        milestone=47
        
        upload() {
            file=$(find "./WarpSystem/WarpSystem-Bundle-$1/target" -type f -name "WarpSystem_v*.jar" | head -n 1)
            name=${file##*/}
            name=${name[@]//.jar/}
            info=${name##*_}
            version=${name:11}
            version=${version[@]//_$info/}
            
            if [ $info == $version ]
            then
                info="New release**__   -   __**"
            else
                old=$info
                info=${info[@]//-free/}
                
                if [ $old != $info ]
                then
                    version="$version-free"
                fi
                
                info=${info[@]//-/ }
                info="$info**__   -   __**"
            fi
            
            NOW="$(LC_ALL=en_GB.utf8 date --universal)"
            echo "Sending '$file' to 'DevBuilds' ($1) channel, this may take a while..." 
            curl -i -H 'Expect: application/json' -F file=@"$file" -F "payload_json={ \"wait\": true, \"avatar_url\":\"https://i.imgur.com/ZoSmsVs.png\", \"content\": \"$rank\n__**$info$version**__   [$NOW]\n\n**Changelog:**\n<https://github.com/CodingAir/WarpSystem-IssueTracker/milestone/$milestone?closed=1>\", \"username\": \"WarpSystem CI\" }" $2
        }
        
        upload "Premium" ${{ secrets.DISCORD_WEBHOOK_PREMIUM }}
        upload "Free" ${{ secrets.DISCORD_WEBHOOK_FREE }}
